name: Run Flask + Ngrok (demo)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: How long to keep the public demo running (1-120 minutes)
        required: true
        default: '120'
        type: string

permissions:
  contents: read

concurrency:
  group: bucharest-ngrok-demo
  cancel-in-progress: true

jobs:
  run-and-expose:
    runs-on: ubuntu-latest
    # Leave room for setup and shutdown around the two-hour demo.
    timeout-minutes: 150
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify ngrok secret
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          if [ -z "$NGROK_AUTH_TOKEN" ]; then
            echo "::error::Add NGROK_AUTH_TOKEN in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Restore geographic and observation caches
        uses: actions/cache@v4
        with:
          path: |
            data/static
            data/dynamic
            cache
          key: urban-data-v2-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            urban-data-v2-${{ runner.os }}-

      - name: Seed fallback parks on a fresh runner
        run: |
          if [ ! -s data/static/bucharest_parks_sectors.geojson ]; then
            mkdir -p data/static
            cp fixtures/demo/bucharest_parks_sectors.geojson data/static/bucharest_parks_sectors.geojson
          fi

      - name: Install ngrok v3
        run: |
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 10 --max-time 120 \
            https://bin.ngrok.com/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz \
            --output "$RUNNER_TEMP/ngrok.tgz"
          tar -xzf "$RUNNER_TEMP/ngrok.tgz" -C "$RUNNER_TEMP" ngrok
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ngrok" version

      - name: Run app and ngrok; publish demo link
        id: demo
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AIRLY_API_KEY: ${{ secrets.AIRLY_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          DEMO_DURATION_MINUTES: ${{ inputs.duration_minutes || '120' }}
        run: python -u scripts/run_ngrok_demo.py --duration-minutes "$DEMO_DURATION_MINUTES"

      - name: Upload app and tunnel logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            server.log
            ngrok.log
          if-no-files-found: ignore
          retention-days: 7
